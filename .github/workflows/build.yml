name: Build tsdm

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Ubuntu 22.04 ships Python 3.10 and an older glibc, so the built binary
    # runs on a wider range of Linux distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Python and Tk
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-tk

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check GUI module imports
        run: python3 -c "import tsdm.gui"

  build:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-tk python3-pip
          python3 -m pip install --upgrade pyinstaller

      - name: Build single-file executable
        run: python3 -m PyInstaller --noconfirm --clean --onefile --name tsdm tsdm_app.py

      - name: Smoke-test the executable
        run: ./dist/tsdm --version

      - name: Package
        run: |
          mkdir -p package
          cp dist/tsdm package/
          cp packaging/tsdm.desktop README.md package/
          tar -C package -czf tsdm-linux-x86_64.tar.gz .
          sha256sum tsdm-linux-x86_64.tar.gz > tsdm-linux-x86_64.tar.gz.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsdm-linux-x86_64
          path: |
            tsdm-linux-x86_64.tar.gz
            tsdm-linux-x86_64.tar.gz.sha256

  release:
    # Runs only for version tags such as v1.0.0.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tsdm-linux-x86_64

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tsdm-linux-x86_64.tar.gz
            tsdm-linux-x86_64.tar.gz.sha256
          generate_release_notes: true
